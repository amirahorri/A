<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <section>
            <input type="text" id="search" placeholder="search zith country name">
            <button id="searchbtn">chercher</button>
            <div id="result">
            </div>
            <ul id="countries"></ul>
        </section>
    </main>
    <script>
let input = document.querySelector("#search")
let btn = document.querySelector("#searchbtn")
let result = document.querySelector("#result")
btn.addEventListener("click", ()=>{
    let value = input.value.trim()
    if(value===""){
        result.innerHTML="<p> rentrez un nom de pays  </p>"
        return
    }
    console.log(value)
    recherchepays(value)
})
async function recherchepays(nom){
    result.innerHTML="<p>recherche en cours </P>"
        try{
        //   const response =await fetch("https://countriesnow.space/api/v0.1/countries/capital"),{
        //method:"POST"
        //headers:{'content-type':"application/json"},
        //body: JSON.stringify({country:nom})

             // });
const response =await fetch (`https://countriesnow.space/api/v0.1/countries/capital/q?country=${nom}`)
console.log(response)
let donnees =await response.json()
console.log(donnees)


result.innerHTML=`
<h3>${donnees.data.name}</h3>
<p>${donnees.data.capital}</p>`
                    
        }catch(error) {
            result.innerHTML='<p>${error.message}</p>'
        }
    }
    async function displaycountry() {
        let country = document.querySelector("#countries")
country.innerHTML ="<li>loading....</li>"
try{
    let response =await fetch("https://countriesnow.space/api/v0.1/countries/capital")
    let donnees = await response.json()
    country.textContent=""
    donnees.data.forEach(pays => {
        country.innerHTML+=`<li>${pays.name}</li>`
    });
        
    }catch(error) {
        country.innerHTML=`<li>${error.message}</li>`
    }

}
displaycountry()
    
    </script>
</body>
</html>
